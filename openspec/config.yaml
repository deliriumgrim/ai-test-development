schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  ADR в adr/ — обязательные архитектурные решения. Автоматически доступен только индекс adr/README.md: перед планированием прочитай его и ADR, релевантные области задачи (поле «Область»), и учитывай их в proposal, specs, design и tasks. ADR фиксируют решение и обоснование (why); SSOT о поведении — openspec/specs/ (what). ADR неизменяемы: пересмотр решения = новый ADR, заменяющий старый.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Пиши на русском языке
    - Укладывайся в 1–2 страницы; фокус на «why», детали реализации — в design
    - Явно перечисляй, что вне объёма (out of scope)
  specs:
    - Пиши на русском языке
    - "Для кода приложения используй вложенные capability-пути: specs/backend/<capability>/ — серверные, specs/frontend/<capability>/ — клиентские, specs/<общая-область>/ — сквозные (например, API-контракт)"
    - Один сценарий — одна проверяемая ситуация; пиши сценарии в Gherkin-стиле (GIVEN/WHEN/THEN), пригодные для прямого переноса в приёмочные тесты
  design:
    - Пиши на русском языке
    - "Включай раздел «Review»: короткий список чек-пойнтов, по которым другой разработчик может проверить дизайн до реализации"
  tasks:
    - Пиши на русском языке
    - Каждая задача — не больше ~2 часов работы
    - Первая задача функциональной группы — приёмочный тест по сценариям спеки (acceptance-first), при наличии в части тестовой инфраструктуры

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
